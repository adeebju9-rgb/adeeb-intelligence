name: Daily News Collector

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-collector:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Run Python collector script
        run: python collector.py

      - name: Commit and push news update
        run: |
          git config --global user.name "Adeeb Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add news.js
          git commit -m "Auto-update daily news [skip ci]" || exit 0
          git push
