<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Adeeb Intelligence | Gaming & Esports Content Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(19, 28, 46, 0.88);
            --border-glow: #1f6feb;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff66;
            --accent-pink: #ff0055;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        body {
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background-color: #0b0f19;
        }

        /* خلفية صورة ثابتة احترافية لعالم الألعاب والجيمنج */
        .static-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* طبقة التعتيم الفاخرة لدمج الصورة مع واجهة الجيمنج وضمان وضوح النصوص */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(11, 15, 25, 0.94) 0%, rgba(15, 23, 42, 0.88) 100%);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 2px solid rgba(31, 111, 235, 0.3);
            margin-bottom: 40px;
            position: relative;
            backdrop-filter: blur(5px);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #58a6ff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(88, 166, 255, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-cyan);
        }

        .game-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 8px 32px rgba(0, 240, 255, 0.2);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(33, 38, 45, 0.8);
            padding-bottom: 10px;
        }

        .badge {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .meta-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .tweet-box-original {
            background: rgba(9, 13, 22, 0.7);
            border: 1px solid rgba(33, 38, 45, 0.8);
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .tweet-box-original .title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tweet-box-original p {
            color: #8b949e;
            font-size: 0.95rem;
            margin: 0 0 12px 0;
            white-space: pre-line;
            line-height: 1.6;
        }

        .tweet-box-enhanced {
            background: rgba(9, 13, 22, 0.85);
            border: 1px solid #1f6feb;
            padding: 16px;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(31, 111, 235, 0.1);
        }

        .tweet-box-enhanced .title {
            font-size: 0.8rem;
            color: var(--accent-cyan);
            margin-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tweet-box-enhanced p {
            color: #ffffff;
            font-size: 1.02rem;
            margin: 0 0 12px 0;
            white-space: pre-line;
            line-height: 1.7;
        }

        textarea.edit-area {
            width: 100%;
            height: 110px;
            background: rgba(4, 6, 11, 0.9);
            color: #fff;
            border: 1px solid var(--accent-cyan);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.95rem;
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 10px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed rgba(48, 54, 61, 0.8);
            padding-top: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-copy-orig {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-copy-orig:hover { background: #30363d; color: #fff; }

        .btn-copy {
            background: rgba(0, 255, 102, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 102, 0.3);
        }
        .btn-copy:hover { background: var(--accent-green); color: #000; }

        .btn-edit {
            background: rgba(31, 111, 235, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(31, 111, 235, 0.3);
        }
        .btn-edit:hover { background: #1f6feb; color: #fff; }

        .btn-save {
            background: #2ea043;
            color: #fff;
        }

        .btn-delete {
            background: rgba(255, 0, 85, 0.15);
            color: var(--accent-pink);
            border: 1px solid rgba(255, 0, 85, 0.3);
        }
        .btn-delete:hover { background: var(--accent-pink); color: #fff; }

        .source-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .source-link:hover { opacity: 0.8; text-decoration: underline; }
    </style>
</head>

        const container = document.getElementById('news-container');
        
        function renderUI() {
            container.innerHTML = '';
            dualNewsData.forEach((item, index) => {
                container.innerHTML += `
                    <div class="game-card">
                        <div class="card-header">
                            <span class="badge">🎮 ${item.category}</span>
                            <span class="meta-text">🕒 ${item.published} | 📌 ${item.source}</span>
                        </div>

                        <!-- التغريدة الأساسية -->
                        <div class="tweet-box-original">
                            <div class="title">📌 التغريدة الأساسية (المطابقة للحساب):</div>
                            <p>${item.original}</p>
                            <div class="actions-bar" style="border-top-style: dotted;">
                                <button class="btn-copy-orig" onclick="copyText('original', ${index})">📋 نسخ النص الأساسي</button>
                                <a href="${item.link}" target="_blank" class="source-link">زيارة المصدر الأصلي ↗</a>
                            </div>
                        </div>

                        <!-- التغريدة المحسنة إعلائياً -->
                        <div class="tweet-box-enhanced">
                            <div class="title">✨ التغريدة المحسنة (إعلانية واحترافية):</div>
                            
                            <div id="enhanced-view-${index}">
                                <p>${item.enhanced}</p>
                            </div>
                            <div id="enhanced-edit-box-${index}" style="display: none; margin-bottom: 10px;">
                                <textarea id="enhanced-textarea-${index}" class="edit-area">${item.enhanced}</textarea>
                            </div>

                            <div class="actions-bar">
                                <div class="btn-group">
                                    <button class="btn-copy" onclick="copyText('enhanced', ${index})">📋 نسخ</button>
                                    <button id="edit-btn-${index}" class="btn-edit" onclick="toggleEdit(${index})">✏️ تعديل</button>
                                    <button id="save-btn-${index}" class="btn-save" onclick="saveEdit(${index})" style="display: none;">💾 حفظ</button>
                                    <button class="btn-delete" onclick="deleteEnhanced(${index})">🗑️ حذف</button>
                                </div>
                                <a href="${item.link}" target="_blank" class="source-link">زيارة المصدر ↗</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleEdit(index) {
            const viewDiv = document.getElementById(`enhanced-view-${index}`);
            const editBox = document.getElementById(`enhanced-edit-box-${index}`);
            const editBtn = document.getElementById(`edit-btn-${index}`);
            const saveBtn = document.getElementById(`save-btn-${index}`);

            if (editBox.style.display === 'none') {
                viewDiv.style.display = 'none';
                editBox.style.display = 'block';
                editBtn.style.display = 'none';
                saveBtn.style.display = 'inline-flex';
            } else {
                viewDiv.style.display = 'block';
                editBox.style.display = 'none';
                editBtn.style.display = 'inline-flex';
                saveBtn.style.display = 'none';
            }
        }

        function saveEdit(index) {
            const textarea = document.getElementById(`enhanced-textarea-${index}`);
            dualNewsData[index].enhanced = textarea.value;
            renderUI();
            alert('⚡ تم حفظ التعديل بنجاح في المنظومة الإعلانية!');
        }

        function deleteEnhanced(index) {
            if (confirm('هل أنت متأكد من تفريغ المحتوى الإعلاني لهذه البطاقة؟')) {
                dualNewsData[index].enhanced = "(تم تفريغ المحتوى الإعلاني مؤقتاً)";
                renderUI();
            }
        }

        function copyText(type, index) {
            const item = dualNewsData[index];
            const textToCopy = type === 'original' ? item.original : `${item.enhanced}\n\n🔗 المصدر: ${item.link}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const msg = type === 'original' ? 'تم نسخ التغريدة الأساسية بنجاح!' : 'تم نسخ النص الإعلاني الاحترافي بنجاح!';
                alert(`🎮 ${msg}`);
            });
        }

        renderUI();
    </script>
</body>
</html>
