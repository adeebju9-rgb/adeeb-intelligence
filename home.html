<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Adeeb Intelligence - منصة المحتوى الإعلاني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px;">
    <h1 style="color: #fff; text-align: center;">🧠 Adeeb Intelligence - منصه المحتوى الإعلاني</h1>
    <p style="text-align: center; color: #8b949e; margin-bottom: 30px;">المحتوى الإعلاني التفاعلي جاهز للنسخ المباشر إلى منصات التواصل الاجتماعي</p>
    
    <div id="news-container" style="max-width: 800px; margin: 0 auto;"></div>

    <script src="news.js"></script>
    <script>
        const container = document.getElementById('news-container');
        if (typeof newsData !== 'undefined') {
            newsData.forEach((item, index) => {
                container.innerHTML += `
                    <div style="background: #161b22; border: 1px solid #30363d; padding: 20px; margin-bottom: 20px; border-radius: 8px;">
                        <span style="background: rgba(88,166,255,0.15); color: #58a6ff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold;">${item.category}</span>
                        <h3 style="color: #fff; margin: 12px 0 8px 0; font-size: 1.1rem;">${item.title}</h3>
                        <p style="color: #c9d1d9; font-size: 0.95rem; line-height: 1.6; white-space: pre-line; background: #0d1117; padding: 12px; border-radius: 6px; border: 1px dashed #30363d;">${item.summary}</p>
                        
                        <div style="font-size: 0.8rem; color: #8b949e; border-top: 1px solid #30363d; padding-top: 12px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
                            <span>🕒 ${item.published} | 📌 ${item.source}</span>
                            <div>
                                <button onclick="copyPost(${index})" style="background: #238636; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-left: 10px;">📋 نسخ النص الإعلاني</button>
                                <a href="${item.link}" target="_blank" style="color: #58a6ff; text-decoration: none; font-size: 0.85rem;">زيارة المصدر ↗</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function copyPost(index) {
            const post = newsData[index];
            const textToCopy = `${post.title}\n\n${post.summary}\n\n🔗 المصدر: ${post.link}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('✨ تم نسخ النص الإعلاني بنجاح! جاهز للصق في السوشيال ميديا.');
            });
        }
    </script>
</body>
</html>
